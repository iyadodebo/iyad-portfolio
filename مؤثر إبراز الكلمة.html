<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مؤثر إبراز الكلمة</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Cairo:wght@400;700;900&family=Inter:ital,wght@0,300;0,400;0,800;1,300;1,400;1,800&family=Lora:ital,wght@0,400;0,700;1,400;1,700&family=Noto+Naskh+Arabic:wght@400;700&display=swap">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f3f2ee;--ink:#18181b;--mut:#666670;--line:#d8d7d0;--btn:#18181b;--btnInk:#fff;--card:#fff;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#131316;--ink:#f1f1f3;--mut:#9a9aa6;--line:#2c2c33;--btn:#f1f1f3;--btnInk:#131316;--card:#1b1b20;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#131316;--ink:#f1f1f3;--mut:#9a9aa6;--line:#2c2c33;--btn:#f1f1f3;--btnInk:#131316;--card:#1b1b20;color-scheme:dark}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Cairo,Tahoma,sans-serif}
main{max-width:940px;margin:0 auto;padding:28px 16px 40px}
h1{font-size:1.6rem;margin:0 0 6px;font-weight:900}
p.sub{margin:0 0 22px;color:var(--mut);line-height:1.7}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:stretch;margin-bottom:16px}
input{flex:1 1 220px;min-width:0;font:inherit;font-size:1.1rem;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
button{font:inherit;font-weight:700;padding:12px 18px;border:0;border-radius:10px;background:var(--btn);color:var(--btnInk);cursor:pointer}
button:disabled{opacity:.45;cursor:default}
button:focus-visible,input:focus-visible{outline:3px solid #3b82f6;outline-offset:2px}
canvas{display:block;width:100%;height:auto;aspect-ratio:9/16;max-width:420px;margin:0 auto;border-radius:12px;border:1px solid var(--line);background:#fff}
#msg{margin-top:12px;color:var(--mut);min-height:1.6em}
</style>
</head>
<body>
<main>
<h1>مؤثر إبراز الكلمة</h1>
<p class="sub">اكتب أي كلمة (عربية أو إنجليزية) وستظهر في مقالات بأنماط خطوط وتظليل متتابعة. سجّل المقطع ثم احفظه كفيديو.</p>
<div class="row">
<input id="w" value="inflation" maxlength="30" aria-label="الكلمة" autocomplete="off">
<button id="rec">سجّل الفيديو (٩ ثوانٍ)</button>
<button id="save" hidden>احفظ الفيديو</button>
</div>
<canvas id="cv"></canvas>
<div id="msg"></div>
</main>
<script>
const W=720,H=1280,DUR=9,CUT=0.18,TW=.14,EF=['rect','rect','spin','flip','flash','none'];
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');cv.width=W;cv.height=H;
const $=id=>document.getElementById(id),msg=t=>$('msg').textContent=t;
const S=[
{bg:'#f1f1f3',dim:'#8a8a92',t:'s',w:400,z:46,hi:'box'},
{bg:'#ffffff',dim:'#8f8f96',t:'s',w:700,z:44,hi:'yellow'},
{bg:'#ececef',dim:'#6c6a78',t:'s',w:700,z:44,hi:'black'},
{bg:'#ffffff',dim:'#222',fg:'#d2380c',t:'s',w:700,z:40,hi:'color'},
{bg:'#ffffff',dim:'#8a8a8a',t:'s',w:400,z:44,hi:'under'},
{bg:'#e4e3e8',dim:'#6b6a76',t:'n',w:400,z:44,hi:'box'},
{bg:'#ffffff',dim:'#c9c9ce',t:'n',w:400,z:50,hi:'bold'},
{bg:'#ffffff',dim:'#8b8680',fg:'#b35a00',t:'s',w:400,z:44,hi:'color'},
{bg:'#ffffff',dim:'#777777',t:'h',w:400,z:46,hi:'box'},
{bg:'#e1e0e6',dim:'#4a4a58',t:'n',w:800,z:46,hi:'box'},
{bg:'#fafafa',dim:'#8a8a8a',t:'s',w:700,z:44,hi:'black'},
{bg:'#ffffff',dim:'#8a8a8a',fg:'#4b3da6',t:'s',w:400,z:44,hi:'color'},
{bg:'#f4f4f6',dim:'#9a9aa2',t:'n',w:300,z:46,hi:'yellow'},
{bg:'#ffffff',dim:'#555555',t:'h',w:400,z:42,hi:'under'}];
const STK={en:{s:'Lora,Georgia,serif',n:'Inter,Arial,sans-serif',h:'"Archivo Black",Impact,sans-serif'},
ar:{s:'"Noto Naskh Arabic","Times New Roman",serif',n:'Cairo,Tahoma,sans-serif',h:'Cairo,Tahoma,sans-serif'}};
const FIL={en:['As the middle of the year approaches, many readers say','that despite steady salaries, the cost of living continues','to rise across regions. Analysts remain cautious, however,','and report persistent pressure on household budgets.'],
ar:['مع اقتراب منتصف العام، يشير كثير من القرّاء إلى أنه','رغم استقرار الرواتب فإن التكاليف تواصل الارتفاع','ويبقى المحللون حذرين لكن الضغوط ما زالت قائمة','على ميزانيات الأسر في مختلف المناطق']};
const KEY={en:['Many families now find that ',' remains higher than expected this year.'],ar:['تُظهر البيانات أن ',' ما زال أعلى من المتوقع هذا العام.']};
const WS={en:{s:[400,700],n:[300,400,800],h:[400]},ar:{s:[400,700],n:[400,700,900],h:[900]}};
let word='inflation';
const R=i=>{const x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x)};

function draw(t){
  const ar=/[\u0600-\u06FF]/.test(word),L=ar?'ar':'en',hold=t>=8;
  const ci=Math.floor((hold?8:t)/CUT),st=S[(ci*5+3)%S.length];
  const bz=st.z*2*(ar?.95:1),z=bz*Math.min(1,W*.72/(word.length*.62*bz)),fam=STK[L][st.t],ws=WS[L][st.t],wt=ws[Math.floor(R(ci+4)*ws.length)],it=R(ci+7)>.5?'italic ':'';
  const yc=H/2+z*.32,lh=z*1.3;
  const ww=st.t=='h'?wt:Math.min(900,wt+(st.hi=='bold'?400:300));
  const wc={box:'#111',yellow:'#111',black:'#fff',color:st.fg,under:'#111',bold:'#111'}[st.hi];
  const font=w=>`${it}${w} ${z}px ${fam}`;
  ctx.save();ctx.fillStyle=st.bg;ctx.fillRect(0,0,W,H);
  {const u=Math.min(t,DUR)/DUR,k=1+.3*u*u*(3-2*u);ctx.translate(W/2,H/2);ctx.scale(k,k);ctx.translate(-W/2,-H/2)}
  const ef=ci>0?EF[Math.floor(R(ci+13)*EF.length)]:'',q=Math.min(1,Math.max(0,(t-ci*CUT)/TW)),eo=1-Math.pow(1-q,3);
  if(ef=='spin'){const a=(1-eo)*(R(ci+14)>.5?1:-1)*Math.PI/2,s=1+.4*(1-eo);ctx.translate(W/2,H/2);ctx.rotate(a);ctx.scale(s,s);ctx.translate(-W/2,-H/2)}
  if(ef=='flip'&&q<.55){ctx.translate(W/2,H/2);ctx.scale(-1,R(ci+15)>.5?-1:1);ctx.translate(-W/2,-H/2)}
  ctx.direction=ar?'rtl':'ltr';ctx.textBaseline='alphabetic';ctx.textAlign='left';
  const hl=(x0,w,y)=>{const p=z*.18;
    if(st.hi=='box'||st.hi=='yellow'||st.hi=='black'){ctx.fillStyle={box:'#fff',yellow:'#ffee00',black:'#000'}[st.hi];ctx.beginPath();ctx.roundRect(x0-p,y-z*.92,w+2*p,z*1.2,z*.12);ctx.fill()}
    if(st.hi=='under'){ctx.fillStyle='#111';ctx.fillRect(x0,y+z*.1,w,Math.max(3,z*.07))}};
  const run=(runs,x,y)=>{for(const r of runs){ctx.font=font(r.w||wt);const w=ctx.measureText(r.t).width,x0=ar?x-w:x;
    if(r.hi)hl(x0,w,y);ctx.fillStyle=r.c;ctx.fillText(r.t,x0,y);x+=ar?-w:w}};
  for(let k=-10;k<=10;k++){
    const y=yc+k*lh;
    if(k==0){const[b,a]=KEY[L];ctx.font=font(wt);const bw=ctx.measureText(b).width;ctx.font=font(ww);const mw=ctx.measureText(word).width;
      run([{t:b,c:st.dim},{t:word,c:wc,w:ww,hi:1},{t:a,c:st.dim}],ar?W/2+mw/2+bw:W/2-mw/2-bw,y)}
    else{const x=ar?W+30+R(ci+9)*110:-30-R(ci+9)*110;run([{t:FIL[L][((k%4)+4)%4],c:st.dim}],x,y)}
  }
  ctx.restore();
  if(ef=='rect'){const e=1-Math.pow(1-(q<.5?q*2:q*2-1),3);let x,y,w,h;
    if(q<.5){w=W*.11;h=H*.4*e;x=W*(.2+.6*R(ci+11))-w/2;y=H*(.25+.5*R(ci+12))-h/2}
    else{w=W*(.12+.7*e);h=H*.08;x=(W-w)*R(ci+16);y=H*(.2+.6*R(ci+12))}
    ctx.save();ctx.beginPath();ctx.rect(x,y,w,h);ctx.clip();
    ctx.globalCompositeOperation='difference';ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);
    ctx.globalCompositeOperation='screen';ctx.fillStyle='#ff1f5a';ctx.fillRect(0,0,W,H);ctx.restore()}
  if(ef=='flash'){ctx.fillStyle=`rgba(255,255,255,${(1-q)*.9})`;ctx.fillRect(0,0,W,H)}
}

let recorder=null,t0=0,blob=null,ext='webm';
function frame(now){
  let t=recorder?Math.max(0,(now-t0)/1000):(now/1000)%DUR;
  draw(Math.min(t,DUR));
  if(recorder){msg(`جارٍ التسجيل… ${Math.min(DUR,Math.floor(t))} / ${DUR} ثوانٍ`);
    if(t>=DUR){const r=recorder;recorder=null;r.stop()}}
  requestAnimationFrame(frame);
}
$('w').addEventListener('input',e=>{word=e.target.value.trim()||'inflation';blob=null;$('save').hidden=true});
$('rec').onclick=()=>{
  if(!window.MediaRecorder||!cv.captureStream){msg('هذا المتصفح لا يدعم تسجيل الفيديو.');return}
  const mime=['video/mp4;codecs=avc1','video/mp4','video/webm;codecs=vp9','video/webm'].find(m=>MediaRecorder.isTypeSupported(m))||'';
  const ch=[],r=new MediaRecorder(cv.captureStream(30),{mimeType:mime,videoBitsPerSecond:8e6});
  r.ondataavailable=e=>e.data.size&&ch.push(e.data);
  r.onstop=()=>{ext=mime.includes('mp4')?'mp4':'webm';blob=new Blob(ch,{type:mime||'video/webm'});
    $('rec').disabled=false;$('save').hidden=false;msg('تم التسجيل. اضغط «احفظ الفيديو».')};
  $('rec').disabled=true;$('save').hidden=true;
  r.start();recorder=r;t0=performance.now();
};
$('save').onclick=async()=>{
  const d=window.claude&&await claude.use('downloads');
  if(!d){msg('الحفظ غير متاح في هذا العرض. افتح الصفحة في claude.ai.');return}
  const name=word.replace(/[^\p{L}\p{N}_-]+/gu,'_')||'effect';
  try{await d.save({filename:`${name}.${ext}`,data:blob});msg('تم الحفظ.')}
  catch(e){if(e.code!=='declined')msg('تعذّر الحفظ: '+(e.message||e.code))}
};
Promise.race([Promise.allSettled(['400 40px Lora','700 40px Lora','italic 400 40px Lora','italic 700 40px Lora','italic 400 40px Inter','italic 800 40px Inter','300 40px Inter','400 40px Inter','800 40px Inter','400 40px "Archivo Black"','400 40px "Noto Naskh Arabic"','700 40px "Noto Naskh Arabic"','400 40px Cairo','700 40px Cairo','900 40px Cairo'].map(f=>document.fonts.load(f))),new Promise(r=>setTimeout(r,4000))]).then(()=>requestAnimationFrame(frame));
</script>
</body>
</html>
